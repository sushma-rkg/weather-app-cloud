<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(155deg, #7b6fcf 0%, #a855a4 50%, #764ba2 100%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
    }

    .app-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      margin-bottom: 24px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .btn-search {
      flex-shrink: 0;
      background: #E8674A;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="app-title">Weather</h1>
    <div class="search-row">
      <input class="search-input" type="text" placeholder="Enter a city…" aria-label="City name">
      <button class="btn-search">Search</button>
    </div>
  </div>
</body>
</html>
